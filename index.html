<!doctype html>
<html lang="ja">
	<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>目標管理｜1on1 ローカル試作</title>
		<link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script>
	</head>
<body>
	<div class="shell"><header><div class="brand"><svg aria-hidden="true" viewBox="0 0 32 32">
		<path fill="currentColor" d="M4 20h4v-8h4V8h8v4h4v8h4v8H4z"/><path fill="#f5ead9" d="M12 16h4v4h-4zm8 0h4v4h-4z"/></svg>
		<div><p class="eyebrow">ONE STEP, TOGETHER.</p>
			<h1>目標<span>名称案</span></h1></div>
		</div>
			<a id="roleLink" href="?mode=view">閲覧者デモ ↗</a>
		</header>
<aside class="demo-notice">ローカル試作・架空データ専用 ｜ 保存先はこのブラウザ内です。別PC共有・認証・リンク発行は未実装</aside>
<section class="intro">
	<div>
		<p class="eyebrow">1ON1 WORKSPACE</p>
	</div>
	<div class="toolbar">
		<button id="refresh">最新情報に更新</button><button id="save" class="primary">変更を保存</button>
	</div>
</section>
<div id="status" role="status" aria-live="polite"></div>
<section class="profile panel"><div class="section-heading">
	<h2>基本登録情報</h2><span id="saveState"></span></div>
	<div class="profile-fields">
		<label>メンバー名 <span class="required">必須</span><input id="memberName" maxlength="50" required placeholder="架空のメンバー名"></label>
		<label>1on1実施日 <span class="required">必須</span><input id="meetingDate" type="date" required></label>
		<label>IT業界歴 <span class="required">必須</span><input id="joinedMonth" type="month" required><small id="experience"></small></label>
	</div>
</section>
<nav class="tabs" aria-label="表示内容"><button id="currentTab" class="selected" aria-pressed="true">現在の目標</button>
	<button id="historyTab" aria-pressed="false">過去3回の1on1</button>
</nav>
<main>
	<section id="current">
		<div class="section-heading">
			<div><p class="eyebrow">YOUR NEXT STEPS</p>
				<h2>取り組み中 <span id="capacity"></span></h2>
			</div>
			<button id="addGoal">＋ 目標を追加</button>
		</div>
		<div id="goals" class="goals"></div>
		<section class="achieved"><div class="section-heading"><h2>達成済み</h2>
			<span>次の1on1で振り返りましょう</span></div><div id="achieved" class="goals"></div>
		</section>
		<section class="record panel"><div><h2>今日の会話を、記録に。</h2>
			<p>保存済みの基本情報・全目標・タスク・進捗を記録します。最新3回を保持します。</p></div>
			<button id="record" class="primary">今回の1on1を記録</button>
		</section>
	</section>
	<section id="history" hidden></section>
</main>
<footer>
	<span>小さな一歩を、ひとつずつ。</span><button id="loadDemo">架空のサンプルを読み込む</button>
</footer>
</div>
<dialog id="modal" aria-labelledby="modalTitle"><form id="modalForm"><h2 id="modalTitle"></h2><p id="modalDescription"></p><div id="modalFields"></div><p id="modalError" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">キャンセル</button><button type="submit" id="confirm" class="primary">確定</button></div></form></dialog></body></html>
